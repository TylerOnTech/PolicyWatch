name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Typecheck, lint, unit + integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: policywatch
          POSTGRES_PASSWORD: policywatch
          POSTGRES_DB: policywatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U policywatch" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://policywatch:policywatch@localhost:5432/policywatch_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma validate
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: npm run test:coverage
      - name: Check for schema drift (migrations match schema.prisma)
        run: |
          PGPASSWORD=policywatch psql -h localhost -U policywatch -d policywatch -c 'CREATE DATABASE policywatch_shadow'
          npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "postgresql://policywatch:policywatch@localhost:5432/policywatch_shadow" --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  docker:
    name: Docker image and Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          tags: policywatch:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build tools image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tools
          push: false
          tags: policywatch-tools:ci
          cache-from: type=gha
      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose config --quiet
          printf 'AWS_REGION=us-east-1\nCLOUDWATCH_LOG_GROUP=/x\nPOSTGRES_PASSWORD=x\nREDIS_PASSWORD=x\n' > /tmp/prod.env
          sudo mkdir -p /opt/policywatch && sudo cp /tmp/prod.env /opt/policywatch/.env
          docker compose -f deploy/docker-compose.prod.yml --env-file /tmp/prod.env config --quiet

  terraform:
    name: Terraform fmt, validate, offline plan tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.17.0"
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - run: terraform test

  ansible:
    name: Ansible syntax and lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/ansible
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ansible-core ansible-lint
      - run: cp inventory/hosts.example.yml inventory/hosts.yml
      - run: ansible-playbook --syntax-check playbooks/site.yml
      - run: ansible-lint --profile production playbooks/site.yml
