---
- name: Install base packages
  ansible.builtin.dnf:
    name:
      - dnf-automatic
      - chrony
      - git
      - tar
      - jq
    state: present

- name: Apply pending security updates
  ansible.builtin.dnf:
    name: "*"
    security: true
    state: latest # noqa package-latest -- intentional: security patches only
    update_only: true

- name: Configure automatic security updates
  ansible.builtin.copy:
    dest: /etc/dnf/automatic.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      [commands]
      upgrade_type = security
      download_updates = yes
      apply_updates = yes
      [emitters]
      emit_via = stdio
      [base]
      debuglevel = 1

- name: Enable dnf-automatic timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    enabled: true
    state: started

- name: Enable time synchronization (Amazon Time Sync via chrony)
  ansible.builtin.systemd_service:
    name: chronyd
    enabled: true
    state: started

- name: Harden SSH (keys only, no root login)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/50-policywatch.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      # Managed by Ansible
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
      X11Forwarding no
      MaxAuthTries 3
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Check for swap file
  ansible.builtin.stat:
    path: /swapfile
  register: common_swapfile

- name: Create swap file (small instances need headroom during image builds)
  ansible.builtin.command:
    cmd: "dd if=/dev/zero of=/swapfile bs=1M count={{ swap_size_mb }}"
    creates: /swapfile
  when: not common_swapfile.stat.exists

- name: Secure and format swap file
  when: not common_swapfile.stat.exists
  block:
    - name: Restrict swap file permissions
      ansible.builtin.file:
        path: /swapfile
        mode: "0600"
        owner: root
        group: root

    - name: Format swap file
      ansible.builtin.command: mkswap /swapfile
      changed_when: true

    - name: Enable swap file
      ansible.builtin.command: swapon /swapfile
      changed_when: true

- name: Persist swap in fstab
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
    state: present

- name: Kernel settings (Redis recommends overcommit; low swappiness keeps swap as a last resort)
  ansible.builtin.copy:
    dest: /etc/sysctl.d/90-policywatch.conf
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by Ansible
      vm.overcommit_memory = 1
      vm.swappiness = 10
  notify: Reload sysctl
